            <svg class="w-16 h-16 mx-auto mb-6 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>

            <!-- Enquire Modal -->

            <button id="close-enquire-modal" class="absolute top-4 right-4 text-white hover:text-primary transition-colors z-20 bg-black/40 hover:bg-black/60 rounded-full p-2 backdrop-blur-md">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <div class="flex flex-col md:flex-row h-full overflow-y-auto">
                <!-- Top/Left Side: Image and Text -->
                <div class="w-full md:w-5/12 h-56 md:h-auto relative overflow-hidden shrink-0">
                    <img src="assets/img/e1.png" alt="Cheerful Kids" class="absolute inset-0 w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-dark/90 via-dark/40 to-transparent"></div>
                    <div class="absolute bottom-0 left-0 p-6 md:p-8 z-10 w-full">
                        <h3 class="font-serif text-2xl md:text-3xl mb-2 md:mb-3 text-white">Store Enquiry</h3>
                        <p class="text-xs md:text-sm text-white/80 leading-relaxed">Whether you're looking for bulk orders, school uniforms, or special gifting options, our team is here to help.</p>
                    </div>
                </div>
                
                <!-- Bottom/Right Side: Form -->
                <div class="w-full md:w-7/12 p-6 md:p-12 bg-secondary/30 dark:bg-darkcard">
                    <form class="space-y-5 md:space-y-6">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 md:gap-6">
                            <div>
                                <label class="block text-sm font-medium mb-1.5 md:mb-2 text-dark dark:text-white">Full Name</label>
                                <input type="text" class="w-full px-4 py-3 rounded-2xl border border-border dark:border-white/10 bg-white dark:bg-darkbg text-dark dark:text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-300 placeholder-muted/70" placeholder="John Doe">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1.5 md:mb-2 text-dark dark:text-white">Email Address</label>
                                <input type="email" class="w-full px-4 py-3 rounded-2xl border border-border dark:border-white/10 bg-white dark:bg-darkbg text-dark dark:text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-300 placeholder-muted/70" placeholder="john@example.com">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1.5 md:mb-2 text-dark dark:text-white">Enquiry Type</label>
                            <div class="relative">
                                <select class="w-full px-4 py-3 rounded-2xl border border-border dark:border-white/10 bg-white dark:bg-darkbg text-dark dark:text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-300 appearance-none">
                                    <option>Bulk Order</option>
                                    <option>School Uniforms</option>
                                    <option>Gifting Options</option>
                                    <option>Other</option>
                                </select>
                                <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-muted">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </div>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1.5 md:mb-2 text-dark dark:text-white">Message</label>
                            <textarea rows="4" class="w-full px-4 py-3 rounded-2xl border border-border dark:border-white/10 bg-white dark:bg-darkbg text-dark dark:text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-300 placeholder-muted/70 resize-none" placeholder="Tell us about your requirements..."></textarea>
                        </div>
                        <button type="button" class="btn-primary w-full shadow-lg shadow-primary/20 hover:-translate-y-1 mt-2">Submit Enquiry</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const enquireModal = document.getElementById('enquire-modal');
            const openBtns = document.querySelectorAll('#open-enquire-modal-btn, #open-enquire-modal-mobile-btn');
            const closeBtn = document.getElementById('close-enquire-modal');
            
            if (enquireModal && openBtns.length > 0 && closeBtn) {
                const modalInner = enquireModal.querySelector('.transform');
                
                openBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        enquireModal.classList.remove('hidden');
                        setTimeout(() => {
                            enquireModal.classList.remove('opacity-0');
                            modalInner.classList.remove('scale-95');
                            modalInner.classList.add('scale-100');
                        }, 10);
                    });
                });
                
                function closeModal() {
                    enquireModal.classList.add('opacity-0');
                    modalInner.classList.remove('scale-100');
                    modalInner.classList.add('scale-95');
                    setTimeout(() => {
                        enquireModal.classList.add('hidden');
                    }, 300);
                }
                
                closeBtn.addEventListener('click', closeModal);
                enquireModal.addEventListener('click', (e) => {
                    if (e.target === enquireModal) closeModal();
                });
            }
        });
    </script>
