<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Baby & Kids Clothing Store</title>
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css?v=1785908019">
    <link rel="stylesheet" href="assets/css/dark-mode.css?v=1785908019">
    <link rel="stylesheet" href="assets/css/rtl.css?v=1785908019">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#C85A48',
                        secondary: '#F5EBE1',
                        accent: '#788E7B',
                        dark: '#2A2421',
                        muted: '#8B8276',
                        border: '#E8DED3',
                        darkbg: '#1F1B18',
                        darkcard: '#2A2421',
                        darktext: '#F5EBE1',
                        white: '#FFFFFF',

                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],

<body class="bg-secondary dark:bg-darkbg text-dark dark:text-darktext transition-colors duration-300 min-h-screen flex items-center justify-center p-4 relative">

    <!-- Top Controls (Theme & RTL) -->
    <div class="absolute top-6 ltr:right-6 rtl:left-6 flex items-center gap-4 z-50">
        <button class="rtl-toggle w-10 h-10 bg-white dark:bg-darkcard rounded-full shadow-md flex items-center justify-center text-sm font-medium text-dark dark:text-white hover:text-primary transition-colors">
            RTL
        </button>
        <button class="theme-toggle w-10 h-10 bg-white dark:bg-darkcard rounded-full shadow-md flex items-center justify-center text-dark dark:text-white hover:text-primary transition-colors">
            <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>
    </div>

    <!-- Centered Card Container -->
    <div class="w-full max-w-md bg-white dark:bg-darkcard border border-border dark:border-white/10 rounded-3xl shadow-2xl p-8 sm:p-10 animate-fade-up mt-16 sm:mt-0 relative z-10">
        
        <!-- Brand Navigation -->
        <div class="flex justify-center mb-8">
            <a href="index.html" class="flex items-center gap-2 text-2xl font-semibold tracking-wide group">
                <svg class="w-8 h-8 text-primary group-hover:scale-110 transition-transform duration-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-7"/><path d="M12 15C8 15 5 11 5 7c0 2 2 4 4 4 2 0 3-1 3-4"/><path d="M12 15c4 0 7-4 7-8 0 2-2 4-4 4-2 0-3-1-3-4"/></svg>
                <span>Sprout<span class="text-primary">.</span></span>
            </a>
        </div>

        <div class="text-center mb-8">
            <h2 class="text-3xl font-serif mb-2 text-dark dark:text-white">Welcome Back</h2>
            <p class="text-muted text-sm">Sign in to access your wishlist and orders.</p>
        </div>
        
        <form class="space-y-6">
            <div class="relative">
                <input type="email" id="email" class="block w-full px-4 pt-6 pb-2 text-dark dark:text-white bg-secondary/30 dark:bg-darkbg border border-border dark:border-white/10 rounded-xl appearance-none focus:outline-none focus:ring-0 focus:border-primary peer transition-colors" placeholder=" " required />
                <label for="email" class="absolute text-sm text-muted duration-300 transform -translate-y-3 scale-75 top-4 z-10 ltr:origin-left rtl:origin-right ltr:left-4 rtl:right-4 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-3 peer-focus:text-primary">Email Address</label>
            </div>
            
            <div class="relative">
                <input type="password" id="password" class="block w-full ltr:pl-4 rtl:pr-4 ltr:pr-12 rtl:pl-12 pt-6 pb-2 text-dark dark:text-white bg-secondary/30 dark:bg-darkbg border border-border dark:border-white/10 rounded-xl appearance-none focus:outline-none focus:ring-0 focus:border-primary peer transition-colors" placeholder=" " required />
                <label for="password" class="absolute text-sm text-muted duration-300 transform -translate-y-3 scale-75 top-4 z-10 ltr:origin-left rtl:origin-right ltr:left-4 rtl:right-4 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-3 peer-focus:text-primary">Password</label>
                <button type="button" class="absolute top-1/2 -translate-y-1/2 ltr:right-4 rtl:left-4 text-muted hover:text-primary transition-colors focus:outline-none">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                </button>
            </div>
            
            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center cursor-pointer">
                    <input type="checkbox" class="w-4 h-4 rounded border-border text-primary focus:ring-primary bg-secondary dark:bg-darkbg">
                    <span class="ltr:ml-2 rtl:mr-2 text-muted">Remember me</span>
                </label>
                <a href="#" class="text-primary hover:underline font-medium">Forgot password?</a>
            </div>
            
            <button type="submit" class="btn-primary w-full py-4 rounded-xl shadow-lg shadow-primary/20">Sign In</button>
        </form>
        
        <div class="mt-8 flex items-center before:flex-1 before:border-t before:border-border dark:before:border-white/10 after:flex-1 after:border-t after:border-border dark:after:border-white/10">
            <span class="px-4 text-sm text-muted">OR CONTINUE WITH</span>
        </div>
        
        <div class="mt-8 grid grid-cols-2 gap-4">
            <button class="w-full flex items-center justify-center px-4 py-3 border border-border dark:border-white/10 rounded-xl hover:bg-secondary dark:hover:bg-darkbg transition-colors">
                <svg class="w-5 h-5 ltr:mr-2 rtl:ml-2" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                <span class="text-sm font-medium text-dark dark:text-white">Google</span>
            </button>
            <button class="w-full flex items-center justify-center px-4 py-3 border border-border dark:border-white/10 rounded-xl hover:bg-secondary dark:hover:bg-darkbg transition-colors">
                <svg class="w-5 h-5 ltr:mr-2 rtl:ml-2 text-dark dark:text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.15 2.95.93 3.78 2.29-3.21 1.95-2.58 6.03.74 7.33-.87 1.95-1.92 3.63-3.17 3.39zm-3.08-14.7c.63-1.44-.06-3.15-1.39-3.95-.76 1.44.11 3.19 1.39 3.95z"/></svg>
                <span class="text-sm font-medium text-dark dark:text-white">Apple</span>
            </button>
        </div>
        
        <div class="mt-8 text-center">
            <p class="text-sm text-muted">Don't have an account? <a href="register.html" class="text-primary font-medium hover:underline">Create Account</a></p>
        </div>
    </div>

    <!-- JS Scripts -->
    <script src="assets/js/main.js?v=1785908331"></script>
</body>
</html>
